name: Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: check custom_components tests
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          args: format --check custom_components tests

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install aiohttp beautifulsoup4 pytest
      - name: Parsing tests, without Home Assistant
        run: python -m pytest tests -q

  integration-tests:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      # Only this module: the harness installs plugins whose autouse fixtures
      # do not mix with the plain sync tests, which the job above covers.
      - name: Integration tests against a real Home Assistant
        run: python -m pytest tests/test_integration.py -q -c tests/pytest.ini
