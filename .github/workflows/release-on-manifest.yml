name: Release on manifest version change

on:
  push:
    branches: [ main, master ]
    paths:
      - "custom_components/airbalticcard/manifest.json"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: ver
        run: |
          set -eu
          MANIFEST=custom_components/airbalticcard/manifest.json
          VERSION=$(jq -r '.version' "$MANIFEST")
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Manifest version missing"; exit 1
          fi

          PREVIOUS=$(git show "${{ github.event.before }}:$MANIFEST" 2>/dev/null \
            | jq -r '.version' || echo "")
          if [ "$VERSION" = "$PREVIOUS" ]; then
            echo "Version unchanged at $VERSION, nothing to release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.ver.outputs.version }} already exists; bump the version first"
            exit 1
          fi

      - name: Build release zip
        if: steps.ver.outputs.changed == 'true'
        run: |
          set -eu
          ZIP="airbalticcard-v${{ steps.ver.outputs.version }}.zip"
          mkdir -p dist
          zip -r "dist/${ZIP}" \
            custom_components/airbalticcard \
            hacs.json \
            README.md \
            -x "*/__pycache__/*" "*/.mypy_cache/*" "*/.pytest_cache/*" "*.pyc" "*.pyo"

      - name: Create release
        if: steps.ver.outputs.changed == 'true'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          allowUpdates: false
          makeLatest: true
          draft: false
          prerelease: false
          generateReleaseNotes: true
          artifacts: dist/airbalticcard-v${{ steps.ver.outputs.version }}.zip
